<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456"><defs><clipPath id="roundIcon"><rect width="456" height="456" rx="104" ry="104"/></clipPath></defs><g clip-path="url(#roundIcon)"><rect width="456" height="456" fill="#08090E"/>
	<defs>
		<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0F172A" />
			<stop offset="55%" stop-color="#090D18" />
			<stop offset="100%" stop-color="#05070C" />
		</linearGradient>
		<radialGradient id="bgGlow" cx="50%" cy="42%" r="50%">
			<stop offset="0%" stop-color="#0284C7" stop-opacity="0.28" />
			<stop offset="100%" stop-color="#090D18" stop-opacity="0" />
		</radialGradient>
	</defs>
	<rect x="0" y="0" width="456" height="456" fill="url(#bgGrad)" />
	<circle cx="228" cy="200" r="210" fill="url(#bgGlow)" />

	<defs>
		<!-- Carta posteriore emergente (Emerald -> Cyan Flow) -->
		<linearGradient id="cardBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#34D399" />
			<stop offset="100%" stop-color="#06B6D4" />
		</linearGradient>

		<!-- Carta intermedia (Sky Cyan -> Blue) -->
		<linearGradient id="cardMidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#7DD3FC" />
			<stop offset="100%" stop-color="#0284C7" />
		</linearGradient>

		<!-- Corpo principale del portafoglio morbido (Shader UI Blue) -->
		<linearGradient id="walletBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#38BDF8" />
			<stop offset="48%" stop-color="#2563EB" />
			<stop offset="100%" stop-color="#1E3A8A" />
		</linearGradient>

		<!-- Onda fluida frontale ("Flow") sul portafoglio -->
		<linearGradient id="flowWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#38BDF8" stop-opacity="0.42" />
			<stop offset="50%" stop-color="#34D399" stop-opacity="0.28" />
			<stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.1" />
		</linearGradient>

		<!-- Linguetta magnetica laterale morbida -->
		<linearGradient id="claspGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0F172A" />
			<stop offset="100%" stop-color="#1E293B" />
		</linearGradient>

		<!-- Bottone luminoso della chiusura -->
		<linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#67E8F9" />
			<stop offset="100%" stop-color="#34D399" />
		</linearGradient>
	</defs>

	<!-- 1. Carta emergente inclinata (Verde Acqua / Ciano) -->
	<g transform="rotate(-9 220 165)">
		<rect x="136" y="114" width="164" height="104" rx="26" ry="26" fill="url(#cardBackGrad)" />
		<rect x="158" y="134" width="38" height="10" rx="5" ry="5" fill="#FFFFFF" fill-opacity="0.45" />
	</g>

	<!-- 2. Seconda carta morbida stratificata -->
	<g transform="rotate(-3 235 175)">
		<rect x="144" y="132" width="172" height="104" rx="26" ry="26" fill="url(#cardMidGrad)" />
	</g>

	<!-- 3. Ombra morbida sotto il corpo del portafoglio -->
	<rect x="114" y="166" width="222" height="174" rx="46" ry="46" fill="#030712" fill-opacity="0.45" />

	<!-- 4. Corpo principale del portafoglio (angoli super arrotondati) -->
	<rect x="112" y="156" width="222" height="172" rx="46" ry="46" fill="url(#walletBodyGrad)" />

	<!-- 5. Onda morbida "Flow" integrata nel corpo del portafoglio -->
	<path d="M 112 246 C 162 214, 214 274, 272 238 C 300 220, 318 224, 334 234 L 334 282 C 334 307, 313 328, 288 328 L 158 328 C 133 328, 112 307, 112 282 Z"
	      fill="url(#flowWaveGrad)" />

	<!-- 6. Curva luminosa fluida di accento -->
	<path d="M 126 252 C 172 222, 218 276, 276 238 C 296 225, 312 224, 324 230"
	      fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.28" />

	<!-- 7. Riflesso superiore glassmorphism -->
	<path d="M 156 162 L 290 162"
	      fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.38" />

	<!-- 8. Chiusura magnetica laterale a capsula morbida -->
	<rect x="272" y="214" width="76" height="56" rx="28" ry="28"
	      fill="url(#claspGrad)" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.45" />

	<!-- 9. Indicatore luminoso nella chiusura -->
	<circle cx="300" cy="242" r="11" fill="url(#dotGrad)" />
	<circle cx="297" cy="239" r="3.5" fill="#FFFFFF" fill-opacity="0.65" />
</g></svg>